{extend name="layout/base" /}{block name="content"}
<div class="store-container user-layout">
  {assign name="active" value="profile" /}
  {include file="user/sidebar" /}
  <section class="user-main">
    <span class="eyebrow">YOUR ACCOUNT</span>
    <h1>账号设置</h1>
    <form id="profile-form" class="profile-editor">
      <label
        >昵称<input
          name="nickname"
          value="{$profile.nickname|default=''}"
          maxlength="20" /></label
      ><label
        >手机号<input
          name="phone"
          readonly
          value="{$profile.phone|default=''}"
          inputmode="tel" /></label
      ><label
        >邮箱<input
          name="email"
          readonly
          value="{$profile.email|default=''}"
          type="email" /></label
      ><label
        >当前密码（修改密码时填写）<input
          name="old_password"
          type="password"
          autocomplete="current-password" /></label
      ><label
        >新密码（至少六位）<input
          name="password"
          type="password"
          autocomplete="new-password" /></label
      ><label
        >头像<input
          id="avatar-file"
          type="file"
          accept="image/jpeg,image/png,image/webp" /></label
      ><button class="button">保存修改</button>
    </form>
  </section>
</div>
{/block}{block name="js"}
<script>
  document.getElementById("profile-form").onsubmit = async (event) => {
    event.preventDefault();
    const r = await BizHelper.request(
      "/user/profile/save",
      Object.fromEntries(new FormData(event.target)),
    );
    BizHelper.toast(r.msg || "已保存", r.code === 0 ? "success" : "error");
  };
  document.getElementById("avatar-file").onchange = async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const data = new FormData();
    data.append("avatar", file);
    const r = await (
      await fetch("/user/avatar/upload", {
        method: "POST",
        headers: { "X-CSRF-TOKEN": window.CSRF_TOKEN },
        body: data,
      })
    ).json();
    BizHelper.toast(r.msg || "头像已更新", r.code === 0 ? "success" : "error");
  };
</script>
{/block}
