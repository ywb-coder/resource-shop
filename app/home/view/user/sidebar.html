<aside class="user-sidebar">
  <div class="user-sidebar-card">
    <div class="user-avatar">
      {if !empty($loginUser.avatar)}<img
        src="{$loginUser.avatar}"
        alt="头像"
      />{else}<i class="fa-regular fa-user"></i>{/if}
    </div>
    <h3>{$loginUser.nickname|default='你好'}</h3>
    <p>你的数字资料夹</p>
  </div>
  <nav class="user-nav">
    <a href="/user/courses"{if isset($active) && $active=='courses'} class="active"{/if}><i class="fa-solid fa-clapperboard"></i> 我的课程</a
    ><a href="/user/center"{if isset($active) && $active=='center'} class="active"{/if}><i class="fa-solid fa-folder-open"></i> 我的资料</a
    ><a href="/user/orders"{if isset($active) && $active=='orders'} class="active"{/if}><i class="fa-solid fa-receipt"></i> 订单记录</a
    ><a href="/user/profile"{if isset($active) && $active=='profile'} class="active"{/if}><i class="fa-regular fa-user"></i> 账号设置</a
    ><a href="/user/questions"{if isset($active) && $active=='questions'} class="active"{/if}><i class="fa-regular fa-comment"></i> 问题反馈</a
    ><a href="/user/logout"
      ><i class="fa-solid fa-arrow-right-from-bracket"></i> 退出登录</a
    >
  </nav>
</aside>
