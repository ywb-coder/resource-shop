{extend name="layout/base" /}
{block name="content"}
<script>
window.CATEGORIES = {:json_encode($categories, JSON_UNESCAPED_UNICODE)};
// 分类按层级排：顶级分类后面紧跟它的子分类，子分类写成「上级 / 子级」
function categoryTreeOpts(cats) {
  const out = [];
  cats.filter(c => !Number(c.parent_id)).forEach(t => {
    out.push({ value: t.id, label: t.name });
    cats.filter(c => Number(c.parent_id) === Number(t.id)).forEach(c => out.push({ value: c.id, label: t.name + ' / ' + c.name }));
  });
  return out;
}
</script>
<div id="app" v-cloak>
  <div class="admin-card">
    <div class="biz-toolbar">
      <input class="search-input" type="search" name="q" autocomplete="off" v-model="params.keyword" placeholder="搜索资料标题" @keyup.enter="load">
      <biz-select v-model="params.category_id" :options="categoryOpts" @change="load"></biz-select>
      <biz-select v-model="params.status" :options="statusOpts" @change="load"></biz-select>
      <biz-select v-model="params.hidden" :options="hiddenOpts" @change="load"></biz-select>
      <div class="spacer"></div>
      <a href="/admin/material/create" class="btn-primary"><i class="fa-solid fa-plus"></i> 上传资料</a>
    </div>
    <div style="padding:0 20px 20px;">
      <div v-if="loading" class="biz-loading"></div>
      <template v-else>
        <table class="biz-table" v-if="list.length">
          <thead>
            <tr>
              <th style="width:60px">封面</th>
              <th>资料信息</th>
              <th>分类</th>
              <th>价格</th>
              <th>销量</th>
              <th title="点下载按钮实际下载的次数">下载</th>
              <th>状态</th>
              <th style="width:220px;white-space:nowrap">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in list" :key="item.id">
              <td>
                <img v-if="item.cover" :src="item.cover" class="table-cover">
                <div v-else class="table-cover" style="background:var(--primary-light);display:flex;align-items:center;justify-content:center;">
                  <i class="fa-solid fa-book" style="color:var(--primary)"></i>
                </div>
              </td>
              <td>
                <div class="material-title">[[ item.title ]]</div>
                <div class="material-meta">
                  <span v-if="item.res_type" class="badge" style="margin-right:4px"
                        :class="{skill:'badge-primary',doc:'badge-warning',software:'badge-default',test:'badge-danger',course:'badge-success'}[item.res_type] || 'badge-default'">
                    [[ {skill: 'Skill 技能', doc: '资料文档', software: '软件工具', test: '心理测试', course: '课程'}[item.res_type] || item.res_type ]]
                  </span>
                  <span v-if="item.is_hot" class="badge badge-warning" style="margin-right:4px">热门</span>
                  <span v-if="item.is_recommend" class="badge badge-primary" style="margin-right:4px">推荐</span>
                  <span v-if="item.goods_type==3" class="badge badge-success" style="margin-right:4px" title="视频课：卡密解锁观看">
                    <i class="fa-solid fa-film"></i> 视频课
                  </span>
                  <span v-if="item.goods_type==2||item.goods_type==3" class="badge" :class="item.stock>0?'badge-primary':'badge-danger'" :title="item.goods_type==3?'视频课卡密库存':'卡密商品，付款后自动发卡'">
                    <i class="fa-solid fa-key"></i> 卡密 · 库存 [[ item.stock ]]
                  </span>
                  <!-- 两种发货方式各是一个独立徽章，都配了就并排显示两个；卡密商品/视频课不显示 -->
                  <span v-if="item.goods_type!=2&&item.goods_type!=3 && (item.delivery_type==1 || item.delivery_type==3)"
                        class="badge badge-default" style="margin-right:4px" title="提供网盘链接">
                    <i class="fa-solid fa-cloud"></i> 网盘
                  </span>
                  <span v-if="item.goods_type!=2&&item.goods_type!=3 && (item.delivery_type==2 || item.delivery_type==3)"
                        class="badge badge-default" title="提供文件直接下载">
                    <i class="fa-solid fa-download"></i> 直链
                  </span>
                </div>
              </td>
              <td>[[ item.category?.name || '-' ]]</td>
              <td>
                <span class="price-tag">¥[[ item.price ]]</span>
                <span v-if="item.original_price>0" class="price-origin">¥[[ item.original_price ]]</span>
              </td>
              <td>[[ item.sales ]]</td>
              <td>
                <span v-if="item.download_count > 0" title="累计下载次数">[[ item.download_count ]]</span>
                <span v-else style="color:var(--text-muted)">0</span>
              </td>
              <td>
                <span class="badge" :class="item.status==1?'badge-success':item.status==2?'badge-warning':'badge-danger'">
                  [[ item.status==1?'上架':item.status==2?'草稿':'下架' ]]
                </span>
                <span v-if="item.is_hidden==1" class="badge badge-default" style="margin-left:4px"
                      title="不在商城列表出现，但链接可直接访问">
                  <i class="fa-solid fa-eye-slash"></i> 隐藏
                </span>
              </td>
              <td style="white-space:nowrap">
                <a :href="'/admin/material/edit?id='+item.id" class="biz-btn biz-btn-edit"><i class="fa-solid fa-pen-to-square"></i> 编辑</a>
                <button v-if="item.status==1" class="biz-btn biz-btn-off" @click="toggleStatus(item)" style="margin-left:4px"><i class="fa-solid fa-box-archive"></i> 下架</button>
                <button v-else class="biz-btn biz-btn-on" @click="toggleStatus(item)" style="margin-left:4px"><i class="fa-solid fa-arrow-up-from-bracket"></i> 上架</button>
                <button class="biz-btn biz-btn-del" @click="del(item)" style="margin-left:4px"><i class="fa-solid fa-trash-can"></i> 删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="biz-empty"><i class="fa-solid fa-book-open"></i><p>暂无资料</p></div>
      </template>
    </div>
    <div class="biz-pager" v-if="total > 0">
      <div class="pager-info">共 [[ total ]] 条，第 [[ page ]]/[[ totalPages ]] 页</div>
      <div class="pager-btns">
        <button class="pager-btn" @click="changePage(page-1)" :disabled="page<=1"><i class="fa-solid fa-chevron-left"></i></button>
        <button v-for="p in pageList" :key="p" class="pager-btn" :class="p===page?'active':''" @click="changePage(p)">[[ p ]]</button>
        <button class="pager-btn" @click="changePage(page+1)" :disabled="page>=totalPages"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
</div>
{/block}
{block name="js"}
<script>
_createAdminApp({
  delimiters: ['[[',']]'],
  data() {
    const cats = window.CATEGORIES || [];
    return {
      list: [], loading: true,
      categories: cats,
      params: { keyword: '', category_id: '', status: '', hidden: '' },
      page: 1, pageSize: 15, total: 0,
      categoryOpts: [{value:'', label:'全部分类'}, ...categoryTreeOpts(cats)],
      statusOpts: [
        {value:'', label:'全部状态'},
        {value:'1', label:'上架'},
        {value:'0', label:'下架'},
        {value:'2', label:'草稿'}
      ],
      hiddenOpts: [
        {value:'', label:'全部陈列'},
        {value:'0', label:'正常展示'},
        {value:'1', label:'已隐藏'}
      ]
    };
  },
  computed: {
    totalPages() { return Math.ceil(this.total / this.pageSize); },
    pageList() {
      const pages = [], t = this.totalPages, p = this.page;
      for (let i = Math.max(1, p-2); i <= Math.min(t, p+2); i++) pages.push(i);
      return pages;
    }
  },
  mounted() { this.load(); },
  methods: {
    async load() {
      this.loading = true;
      const q = new URLSearchParams({ ...this.params, page: this.page, page_size: this.pageSize });
      const r = await BizHelper.get('/admin/material/list?' + q);
      this.list = r.data?.list || [];
      this.total = r.data?.total || 0;
      this.loading = false;
    },
    changePage(p) { if (p < 1 || p > this.totalPages) return; this.page = p; this.load(); },
    async toggleStatus(item) {
      const next = item.status == 1 ? 0 : 1;
      if (next === 0) {
        const ok = await BizHelper.confirm('确定下架该资料吗？下架后用户将无法购买');
        if (!ok) return;
      }
      const r = await BizHelper.request('/admin/material/status', { id: item.id, status: next });
      if (r.code !== 0) return BizHelper.toast(r.msg, 'error');
      // 就地改状态，不重新拉列表：否则页面会跳回顶部，连着操作很难受
      item.status = next;
      BizHelper.toast(next === 1 ? '已上架' : '已下架');
    },

    async del(item) {
      const ok = await BizHelper.confirm(
        '确定删除《' + item.title + '》吗？',
        { text: '封面、预览图和资料文件会一并删除，且无法恢复。只是暂时不卖请用「下架」。',
          confirm: '确认删除' }
      );
      if (!ok) return;

      const r = await BizHelper.request('/admin/material/delete', { id: item.id });
      if (r.code !== 0) return BizHelper.toast(r.msg, 'error');

      // 就地移除，不重拉列表：否则页面跳回顶部，连着删很难受
      const i = this.list.indexOf(item);
      if (i > -1) this.list.splice(i, 1);
      this.total--;
      BizHelper.toast('已删除');
    }
  }
}).mount('#app');
</script>
{/block}
